<div id="app" class="app">
  <header class="top">
    <div class="brand">
      <svg class="logo"><use href="#i-logo"/></svg>
      <div class="brand-text"><span class="brand-name">kOlapsis</span><span class="brand-sub" id="brand-sub">pi-dash</span></div>
    </div>
    <div class="clock">
      <div class="time" id="time">--<span class="colon">:</span>--</div>
      <div class="date" id="date"></div>
    </div>
    <div class="top-right">
      <div class="weather" id="weather"></div>
      <div class="mailbadge" id="mailbadge"></div>
    </div>
  </header>

  <main class="main">
    <div class="col col-a">
      <section class="tile tile-qonto" id="tile-qonto" data-c="qonto"></section>
      <section class="tile tile-stripe" id="tile-stripe" data-c="stripe"></section>
    </div>
    <div class="col col-b">
      <section class="tile tile-stars" id="tile-stars" data-c="github"></section>
      <section class="tile tile-visits" id="tile-visits" data-c="umami"></section>
      <section class="tile tile-maint" id="tile-maint" data-c="registry"></section>
    </div>
    <div class="col col-c">
      <section class="tile tile-inbox" id="tile-inbox" data-c="mail"></section>
      <section class="tile tile-agenda" id="tile-agenda" data-c="calendar"></section>
    </div>
  </main>

  <section class="health" id="health"></section>

  <footer class="foot">
    <div class="foot-left" id="foot-collectors"></div>
    <div class="foot-right" id="foot-right"></div>
  </footer>
</div>

<div id="splash" class="splash" hidden>
  <svg class="logo"><use href="#i-logo"/></svg>
  <div class="splash-text">connexion au tableau de bord…</div>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
